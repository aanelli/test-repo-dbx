# This is a Declarative Automation Bundle definition for test_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_bundle
  uuid: 58b170e3-0a76-4622-ba99-f1c27431545c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b02cb99f-1655.cloud.databricks.com
    variables:
      catalog: club_data_lakehouse
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-b02cb99f-1655.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/a.anelli@iconsulting.biz to make sure we only have a single copy.
      root_path: /Workspace/Users/a.anelli@iconsulting.biz/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: club_data_lakehouse
      schema: prod
    permissions:
      - user_name: a.anelli@iconsulting.biz
        level: CAN_MANAGE
